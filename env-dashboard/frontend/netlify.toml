# Static site configuration for Netlify

# Set the base directory for the frontend
[build]
  base = "env-dashboard/frontend"
  publish = "."
  command = "echo 'Frontend is a static SPA - no build step needed'"

# SPA routing configuration for client-side routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Environment variable configuration
[context.production.environment]
  SKYGUARD_API_BASE = "https://skyguard-backend.onrender.com"  # Replace with actual backend URL
