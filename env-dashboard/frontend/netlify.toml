# Static site configuration for Netlify

[build]
  base = "."
  publish = "."
  command = "echo 'Frontend is a static SPA - no build step needed'"

# SPA routing: all routes serve index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security and CORS headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Allow Socket.IO and API connections to Render backend
[[headers]]
  for = "/socket.io/*"
  [headers.values]
    Access-Control-Allow-Origin = "https://skyguard-backend.onrender.com"
